<section class="space-controls" aria-label="Space">
  <p id="space-status" role="status">Local projects</p>
  <button type="button" id="space-create">Create Space</button>
  <button type="button" id="space-share" hidden>Copy Space link</button>
  <button type="button" id="space-retry" hidden>Retry</button>
  <p id="space-help">A Space shares these projects across browsers. Anyone with its link can edit.</p>
  <div id="space-conflict" hidden>
    <p id="space-conflict-message"></p>
    <button type="button" id="space-reload">Reload saved project</button>
    <button type="button" id="space-copy">Save as a copy</button>
  </div>
</section>

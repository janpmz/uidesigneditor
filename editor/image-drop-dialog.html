<dialog id="picture-drop-choice" class="picture-choice" aria-labelledby="picture-choice-title" aria-describedby="picture-choice-files">
  <h2 id="picture-choice-title">Open picture</h2>
  <p id="picture-choice-files" class="picture-choice-files"></p>
  <div class="picture-choice-options">
    <button id="picture-choice-add" class="picture-choice-option" aria-label="Add to page?">
      <strong>Add to page?</strong><span>Place the picture in the current design.</span>
    </button>
    <button id="picture-choice-new" class="picture-choice-option" aria-label="Open as new page?">
      <strong>Open as new page?</strong><span>Start a fresh page at the picture’s size.</span>
    </button>
  </div>
  <div class="picture-choice-actions"><button id="picture-choice-cancel">Cancel</button></div>
</dialog>

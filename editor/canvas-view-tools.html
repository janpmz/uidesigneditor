<div class="canvas-view-tools" role="group" aria-label="Canvas view">
  <button id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
  <select id="zoom" aria-label="Canvas zoom"><option value="fit">Fit page</option><option value="all">Fit all</option><option value=".25">25%</option><option value=".5">50%</option><option value="1">100%</option><option value="2">200%</option><option value="4">400%</option><option value="8">800%</option><option id="zoom-custom" value="custom" hidden>Custom</option></select>
  <button id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
</div>
